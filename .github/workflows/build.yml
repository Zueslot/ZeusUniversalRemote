
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configure Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "Android SDK manager not found"
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          "$SDKMANAGER" --version

      - name: Install Android SDK packages
        run: |
          "$SDKMANAGER" --licenses < <(yes || true)
          "$SDKMANAGER" \
            "platforms;android-35" \
            "build-tools;35.0.0"
        shell: bash

      - name: Build and check Zeus Universal Remote
        run: gradle :app:assembleDebug :shield-companion:assembleDebug :app:testDebugUnitTest :shared:testDebugUnitTest :shield-companion:testDebugUnitTest :app:lintDebug :shared:lintDebug :shield-companion:lintDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZeusUniversalRemote-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Shield companion APK
        uses: actions/upload-artifact@v4
        with:
          name: ZeusShieldCompanion-APK
          path: shield-companion/build/outputs/apk/debug/shield-companion-debug.apk
          if-no-files-found: error
